[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lockerlab"
version = "0.1.0"
description = "Paper-only storage-unit auction research, underwriting and paper-trading system"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "python-dateutil>=2.8",
    "tzdata>=2024.1",  # zoneinfo data on machines without a system tz database (Windows)
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "jinja2>=3.1", "python-multipart>=0.0.9", "anthropic>=1.0"]

[project.scripts]
lockerlab = "lockerlab.cli:main"

[tool.setuptools.packages.find]
include = ["lockerlab*"]

[tool.setuptools.package-data]
lockerlab = ["migrations/*.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
