[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lockerlab"
version = "0.1.0"
description = "Paper-only storage-unit auction research, underwriting and paper-trading system"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "tzdata>=2024.1",  # zoneinfo data on machines without a system tz database (Windows)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lockerlab = "lockerlab.cli:main"

[tool.setuptools.packages.find]
include = ["lockerlab*"]

[tool.setuptools.package-data]
lockerlab = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
