# Market-level cost assumptions. Every number is {value, status, source}.
#
# status:
#   VERIFIED    confirmed first-hand by the operator (phone call, receipt, quote)
#   SOURCED     from a cited public source, not yet confirmed first-hand
#   UNVERIFIED  secondary/illustrative source, or from a different city
#   GUESS       placeholder judgement; replace with data ASAP
#
# Decisions store the full config plus the list of non-VERIFIED assumptions they
# used, so we can later see how much each unverified number mattered.
# Money is in cents. Volumes are cubic feet.

colorado_springs:
  timezone: America/Denver
  sales_tax_rate:
    value: 0.082
    status: SOURCED
    source: "2.90 state + 1.23 El Paso County + 3.07 city + 1.00 PPRTA = 8.20% (admin.elpasoco.com sales tax page). v1 used 8.25% UNVERIFIED."
  home_to_unit_miles_default:
    value: 10
    status: GUESS
    source: "Typical one-way distance within Colorado Springs; override per auction with distance_miles."
  dump_round_trip_miles:
    value: 20
    status: GUESS
    source: "Detour to Woodmen Dump (NE Colorado Springs) from a unit elsewhere in the city."
  dump_stop_hours: {value: 0.5, status: GUESS, source: "queue, weigh in, unload, weigh out"}
  donation_round_trip_miles: {value: 8, status: GUESS, source: "ARC / Goodwill drop-offs are numerous in the city"}
  donation_stop_hours: {value: 0.33, status: GUESS}
  disposal:
    # v2 (2026-10 audit): the v1 $126.50/ton + $253 minimum is the Waste
    # Connections CS Transfer Station's CONSTRUCTION & DEMOLITION rate
    # (page text: "Gate Rate - Construction & Demolition (C&D) - By Ton").
    # It was wrongly applied to household junk. Kept for reference only; the
    # weight_schedule below replaces it.
    per_ton_cents:
      value: 12650
      status: SOURCED
      source: "Waste Connections CS Transfer, C&D only. NOT USED when weight_schedule is set."
    minimum_charge_cents:
      value: 25300
      status: SOURCED
      source: "Waste Connections CS Transfer C&D 2-ton minimum. NOT USED when weight_schedule is set."
    weight_schedule:
      value: [[30, 700], [100, 2500], [250, 5400], [500, 8600], [1000, 13100], [2000, 17600]]
      status: SOURCED
      source: "Woodmen Dump posted estimates (woodmendump.com/pricing), public, by scale weight, no minimum weight. Peak Disposal (Monument, peakdr.com) posts nearly identical figures. Call to confirm."
    mattress_each_cents:
      value: 5900
      status: SOURCED
      source: "Woodmen Dump: $59 + weight. Spring Back Colorado recycles for $40 drop-off (Colorado Springs site not confirmed); Urban Recycling reportedly $50. v1 used $86.25 (Waste Connections)."
    mattress_weight_lbs: {value: 60, status: GUESS}
    appliance_each_cents:
      value: 5000
      status: GUESS
      source: "Woodmen: fridge/AC $89 (freon removal incl.), washer/dryer/stove $0.06/lb (~$9). Blend; set per item when known."
    ewaste_each_cents:
      value: 500
      status: GUESS
      source: "El Paso County HHW is free (appointment, proof of residency, ~5 per device type per year, TVs >40in excluded); Blue Star Recyclers $0.79/lb for displays. Blend."
    negligible_trash_cuft:
      value: 3
      status: GUESS
      source: "Pathway A: ~2 kitchen bags. Leaves with the operator's own garbage."
    free_household_trash_cuft:
      value: 0
      status: GUESS
      source: "Pathway B: spare capacity in household bins the operator already pays for. 0 = conservative. One 96-gal cart = ~12.8 cuft. Colorado Springs has private haulers only (no city service)."
    junk_hauler_min_cents:
      value: 15000
      status: UNVERIFIED
      source: "Pathway G: Colorado Springs minimum pickup ~$108-189, 1/4 truck ~$162-324 (junkcostcalculator.com, secondary)."
    lbs_per_cuft:
      value: 9.0
      status: GUESS
      source: "Mixed bulky household waste ~250 lb/yd3. Plausible range 5-15. Weigh real loads (Woodmen gives a scale ticket)."
  vehicles: &default_vehicles
    # kind: borrowed = a friend's vehicle (cash cost = fuel + thank-you);
    # rental = paid. min_renter_age from rental terms.
    friend_sedan:
