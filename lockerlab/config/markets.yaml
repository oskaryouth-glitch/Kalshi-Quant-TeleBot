      value: 0
      status: SOURCED
      source: "El Paso County HHW: free for El Paso/Teller households with proof of residency, ~5 devices/household/year (2023 flyer). Cap limits volume use."
    donation_each_trip_cents:
      value: 0
      status: GUESS
    free_household_trash_cuft:
