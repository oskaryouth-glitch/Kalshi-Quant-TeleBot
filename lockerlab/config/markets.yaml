# Market-level cost assumptions. Every number is {value, status, source}.
#
# status:
#   VERIFIED    confirmed first-hand by the operator (phone call, receipt, quote)
#   SOURCED     from a cited public source, not yet confirmed first-hand
#   UNVERIFIED  secondary/illustrative source, or from a different city
#   GUESS       placeholder judgement; replace with data ASAP
#
# Decisions store the full config plus the list of non-VERIFIED assumptions they
# used, so we can later see how much each unverified number mattered.
# Money is in cents. Volumes are cubic feet.

colorado_springs:
  timezone: America/Denver
  sales_tax_rate:
    value: 0.0825
    status: UNVERIFIED
    source: "Approximate combined state+county+city+PPRTA rate; confirm at tax.colorado.gov. A resale certificate may exempt purchases for resale; confirm with CDOR and the facility."
