    per_ton_cents:
      value: 12650
      status: SOURCED
      source: "Waste Connections Colorado Springs Transfer Station gate rate (C&D), per wasteconnections.com/colorado-springs-transfer, page dated 2026-09-22, via web research. CALL TO CONFIRM applicability to household loads."
    minimum_charge_cents:
      value: 25300
      status: SOURCED
      source: "Same page: 2-ton minimum ($253). If true, this minimum dominates small-unit disposal cost. CALL TO CONFIRM; also price WM Colorado Springs Landfill and junk-hauler alternatives."
